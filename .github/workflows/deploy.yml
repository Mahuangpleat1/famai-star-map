name: Deploy (manual opt-in)

# Enable Pages -> GitHub Actions in repository settings, then run explicitly.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Configure Pages and determine root or project base
        id: pages
        uses: actions/configure-pages@v5
      - name: Required quality gates and production build
        run: npm run verify:all && npm run test:scripts && python3 -m unittest discover -s scripts/__tests__ -p 'test_package_source.py'
        env:
          CI: "true"
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
      - name: Pages fallback document
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published shell, resources, manifest and Pages fallback
        run: npm run smoke:deploy
        env:
          STAGING_URL: ${{ steps.deployment.outputs.page_url }}
          SMOKE_PLATFORM: github-pages
