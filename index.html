    <!-- CSP meta 兜底:部署时建议用 HTTP 头覆盖,本 meta 在 file:// / 静态托管无 header 场景下生效。 -->
    <!--
      - default-src 'self': 仅允许同源资源
      - script-src 'self' 'unsafe-eval': Vite dev 模式 + 某些 three.js 库需要 eval
      - style-src 'self' 'unsafe-inline': CSS-in-JS / inline <style> 需要
      - img-src 'self' data: blob: https://flk.npc.gov.cn: 用户头像 / 文档预览(可空) + 法条引用图
      - connect-src 'self' https:: LLM 是用户配置的任意 HTTPS,Phase 5 收紧
      - frame-src 'self': 仅允许同源 iframe
      - object-src 'none': 禁 Flash / 插件
      - base-uri 'self': 禁 <base> 跳转劫持
      - form-action 'self': 表单只能提交到同源
      - frame-ancestors 'none': 防 clickjacking
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://flk.npc.gov.cn; font-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:* http://[::1]:* ws://localhost:* ws://127.0.0.1:*; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />

    <link rel="stylesheet" href="/src/law-universe-lab/css/law-universe-lab-print.css" media="print" />

    <!-- Fallback CSS so first paint isn't blank before React mounts -->
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; padding: 0; height: 100%; background: #05070a; color: #e7e3d2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; }
      #root { height: 100%; }
      .app-pre-shell { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; pointer-events: none; opacity: 1; transition: opacity 200ms ease; }
      .app-pre-shell__title { font-size: 18px; letter-spacing: 0.32em; color: #f3c86f; font-weight: 500; }
      .app-pre-shell__subtitle { font-size: 12px; letter-spacing: 0.4em; color: rgba(231, 227, 210, 0.6); }
      .app-pre-shell__pulse { width: 12px; height: 12px; border-radius: 50%; background: #f3c86f; box-shadow: 0 0 18px rgba(243, 200, 111, 0.7); animation: app-pre-shell-pulse 1.6s ease-in-out infinite; }
      @keyframes app-pre-shell-pulse { 0%, 100% { transform: scale(0.6); opacity: 0.4; } 50% { transform: scale(1); opacity: 1; } }
      body.app-mounted .app-pre-shell { opacity: 0; }
      @media (prefers-reduced-motion: reduce) { .app-pre-shell__pulse { animation: none; } }

      /* 404 路径降级 UI —— 与 inline 404 脚本配对 */
      body.app-route-miss .app-pre-shell { display: none !important; }
      .app-route-miss { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(circle at 50% 50%, rgba(243, 200, 111, 0.06), transparent 40%), #05070a; z-index: 9999; }
      .app-route-miss__panel { max-width: 480px; text-align: center; padding: 32px 28px; background: rgba(11, 13, 18, 0.78); border: 1px solid rgba(243, 200, 111, 0.28); border-radius: 12px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6); }
      .app-route-miss__title { margin: 0 0 12px 0; color: #f3c86f; font-size: 22px; font-weight: 600; letter-spacing: 0.04em; }
      .app-route-miss__hint { margin: 0 0 16px 0; color: rgba(231, 227, 210, 0.85); font-size: 14px; line-height: 1.6; }
      .app-route-miss__path { margin: 0 0 20px 0; color: rgba(231, 227, 210, 0.55); font-size: 12px; word-break: break-all; }
      .app-route-miss__path code { display: inline-block; margin-left: 4px; padding: 2px 8px; background: rgba(243, 200, 111, 0.12); color: #f3c86f; border-radius: 4px; font-family: ui-monospace, "SF Mono", "Cascadia Mono", monospace; font-size: 12px; }
      .app-route-miss__btn { display: inline-block; padding: 10px 24px; background: linear-gradient(135deg, #f3c86f 0%, #d99c44 100%); color: #05070a; text-decoration: none; font-size: 14px; font-weight: 600; border-radius: 6px; transition: transform 0.15s ease, box-shadow 0.15s ease; }
      .app-route-miss__btn:hover, .app-route-miss__btn:focus-visible { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(243, 200, 111, 0.3); outline: none; }
      .app-route-miss__btn:focus-visible { outline: 2px solid #f3c86f; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { .app-route-miss__btn { transition: none; } }
    </style>

    <!-- 早期启动脚本(隐藏 pre-shell + 404 降级):CSP script-src 无 unsafe-inline,必须外链 -->
